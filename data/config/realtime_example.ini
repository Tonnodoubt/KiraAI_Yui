# B站实时评论适配器配置
# 复制此文件为 realtime.ini 并填入实际配置

[realtime]
# ============ 基础配置 ============
# 是否启用
enabled = true

# B站登录凭证（从浏览器Cookie获取）
sessdata = 你的SESSDATA
bili_jct = 你的bili_jct
dedeuserid = 你的DedeUserID
buvid3 = 你的buvid3（可选）
ac_time_value = 你的ac_time_value（可选）

# ============ 监听配置 ============
# 要监听的视频BV号（逗号分隔）
# 示例：BV1xx, BV2xx, BV3xx
monitor_videos = BV1yourBVid

# 视频发布时间（与monitor_videos一一对应，用 | 分隔）
# 格式：YYYY-MM-DD HH:MM:SS
# 如果不设置，则使用启动时间作为基准
# 示例：2024-01-15 15:00:00|2024-01-16 14:00:00
release_times = 2024-01-15 15:00:00

# ============ 时间窗口配置 ============
# 只回复发布后多久内的评论（分钟）
# 建议设置 60-180 分钟（1-3小时）
time_window_minutes = 120

# 轮询间隔（秒）
# 建议设置 10-30 秒
poll_interval = 15

# ============ 频率控制配置 ============
# 【重要】这些参数用于避免触发B站风控

# 每分钟最大回复数
# 建议设置 1-2 条
max_replies_per_minute = 2

# 每小时最大回复数
# 建议设置 15-30 条
max_replies_per_hour = 20

# 最小回复间隔（秒）
# 建议设置 30-60 秒
min_interval = 30

# 最大回复间隔（秒）
# 建议设置 60-120 秒
max_interval = 90

# ============ 回复策略配置 ============
# 回复意愿阈值（0-1，越高越严格）
# 建议 0.4-0.7，更高可以减少回复量
response_threshold = 0.5

# 是否只回复顶级评论
# 建议设置为 true
top_level_only = true

# 是否跳过已有回复的评论
# 建议设置为 true
skip_replied = true

# ============ 精选回复策略（降低风控风险）============
# 【重要】每轮轮询最多回复几条
# 建议 1-2 条，大幅降低风控风险
max_replies_per_poll = 2

# 【重要】时间窗口内最大总回复数（硬上限）
# 建议设置 10-20 条，避免回复过多触发风控
max_total_replies = 15

# 优先回复包含这些关键词的评论（逗号分隔，留空则不限制）
# 例如：厉害,好看,喜欢,期待
priority_keywords =

# 排除关键词（包含这些的不回复）
# 建议排除引流、广告相关词汇
exclude_keywords = 粉丝群,群号,加群,微信群,QQ群,私信,私信我

# ============ 验证码冷却配置 ============
# 遇到验证码后暂停回复的时间（秒）
# 默认 7200 秒（2小时）
captcha_cooldown_seconds = 7200
