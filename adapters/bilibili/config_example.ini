# B站适配器配置示例
# 将此配置添加到 data/config/adapters.ini 文件中

[bilibili]
enabled = false
platform = Bilibili
desc = B站自动回复机器人
bot_pid = your_user_id

# B站登录凭证（从浏览器Cookie中获取）
# 1. 打开浏览器，登录B站
# 2. 按F12打开开发者工具
# 3. Application -> Cookies -> https://www.bilibili.com
# 4. 找到以下值并填入：
# 必需字段：
sessdata = 你的SESSDATA值
bili_jct = 你的bili_jct值
dedeuserid = 你的DedeUserID值
# 可选字段（如果发送评论时遇到"账号未登录"错误，请添加这些字段）：
buvid3 = 你的buvid3值（可选）
ac_time_value = 你的ac_time_value值（可选）

# 功能开关
reply_private_messages = true
reply_comments = true

# 频率限制（防止被限流）
reply_interval = 5
max_replies_per_hour = 20

# 验证码错误冷却期（秒），遇到验证码错误后暂停回复的时间，默认7200秒（2小时）
# 建议设置为1-3小时（3600-10800秒），避免频繁触发验证码
captcha_cooldown_seconds = 7200

# 监听目标（可选）
# 要监听评论的视频BV号列表（逗号分隔）
monitor_video_ids = 
# 要监听评论的动态ID列表（逗号分隔）
monitor_dynamic_ids = 

# 白名单（可选，留空则处理所有消息）
# 用户ID列表（逗号分隔），只有白名单中的用户消息会被处理
user_list = 
# 群组列表（B站不使用，可留空）
group_list = 

